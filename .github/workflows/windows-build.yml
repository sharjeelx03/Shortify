name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Copy ffmpeg binaries
        shell: cmd
        run: |
          if not exist bin mkdir bin
          for /f "delims=" %%F in ('where ffmpeg') do copy "%%F" bin\ffmpeg.exe & goto copied_ffmpeg
          :copied_ffmpeg
          for /f "delims=" %%F in ('where ffprobe') do copy "%%F" bin\ffprobe.exe & goto copied_ffprobe
          :copied_ffprobe

      - name: Build EXE
        run: pyinstaller Shortify.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shortify-Windows
          path: dist/Shortify
